<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AulaSTEAM - Gestión de Préstamos</title>
    <!-- Tailwind CSS para diseño responsivo moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 lg:p-8">

    <!-- Contenedor Principal de la Aplicación -->
    <main class="max-w-md w-full mx-auto bg-slate-800/80 backdrop-blur-md rounded-2xl p-6 sm:p-8 shadow-2xl border border-slate-700/50 mt-4 sm:mt-10">
        
        <!-- Cabecera -->
        <header class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600/20 text-blue-400 rounded-2xl mb-4 border border-blue-500/30">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-white mb-1">AulaSTEAM</h1>
            <p class="text-slate-400 font-medium">Escáner de Equipos</p>
        </header>

        <!-- Instrucción descriptiva -->
        <div class="bg-slate-900/60 border border-slate-700/60 rounded-xl p-4 mb-6 text-center">
            <p class="text-sm text-slate-300">
                Escanea la etiqueta del Chromebook, Portátil, Tablet o Micrófono
            </p>
        </div>

        <!-- Formulario de Registro -->
        <form id="prestamoForm" onsubmit="return false;" class="space-y-5">
            
            <!-- Campo Docente -->
            <div>
                <label for="docenteInput" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                    Docente / Profesor/a
                </label>
                <input 
                    type="text" 
                    id="docenteInput" 
                    placeholder="Escribe el nombre del docente..." 
                    class="w-full bg-slate-900 border border-slate-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 text-white placeholder-slate-500 rounded-xl px-4 py-3 text-base outline-none transition duration-200"
                    required
                >
            </div>

            <!-- Campo Código de Equipo -->
            <div>
                <label for="equipoInput" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                    Código del Equipo
                </label>
                <div class="relative">
                    <input 
                        type="text" 
                        id="equipoInput" 
                        value="CAR-PORT" 
                        placeholder="Ej. CAR-PORT" 
                        class="w-full bg-slate-900 border border-slate-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 text-white font-mono rounded-xl px-4 py-3 text-base outline-none transition duration-200"
                        required
                    >
                    <span class="absolute right-3 top-3 text-xs bg-blue-500/20 text-blue-300 border border-blue-500/30 px-2 py-1 rounded-md font-semibold">
                        Etiqueta
                    </span>
                </div>
            </div>

            <!-- Botón Principal de Envío -->
            <button 
                type="button" 
                id="btnGuardar"
                class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-blue-600/30 hover:shadow-blue-500/40 transition duration-200 transform active:scale-[0.99] flex items-center justify-center space-x-2 mt-4"
            >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
                </svg>
                <span>Registrar Préstamo</span>
            </button>

        </form>

        <!-- Mensajes de Estado (Éxito / Error) -->
        <div id="statusMessage" class="hidden mt-6 p-4 rounded-xl text-center text-sm font-medium transition-all duration-300"></div>

    </main>

    <!-- Pie de página -->
    <footer class="text-center text-xs text-slate-500 py-6">
        <p>Sistema de Préstamos STEAM Toxiria &copy; 2026</p>
    </footer>

    <!-- LÓGICA DE CONEXIÓN A GOOGLE SHEETS -->
    <script>
        // URL de Apps Script del despliegue (desplegado como 'Cualquiera')
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydTbUNUR6yO0yOdKixFUWoNo4OrpT3X8ftYfRAn6-IaBdyPeqjs1Wq1Xz7tqsCi2gh/exec";

        // Función para mostrar estados en pantalla sin usar alert()
        function mostrarEstado(mensaje, esExito) {
            const statusDiv = document.getElementById("statusMessage");
            statusDiv.innerText = mensaje;
            statusDiv.classList.remove("hidden", "bg-emerald-500/20", "text-emerald-300", "border-emerald-500/30", "bg-rose-500/20", "text-rose-300", "border-rose-500/30");
            
            if (esExito) {
                statusDiv.classList.add("bg-emerald-500/20", "text-emerald-300", "border", "border-emerald-500/30");
            } else {
                statusDiv.classList.add("bg-rose-500/20", "text-rose-300", "border", "border-rose-500/30");
            }

            // Ocultar mensaje tras 5 segundos
            setTimeout(() => {
                statusDiv.classList.add("hidden");
            }, 5000);
        }

        // Función principal de envío de préstamos
        function registrarPrestamo() {
            const docenteInput = document.getElementById("docenteInput");
            const equipoInput = document.getElementById("equipoInput");
            const btnGuardar = document.getElementById("btnGuardar");

            const docente = docenteInput ? docenteInput.value.trim() : "";
            const equipo = equipoInput ? equipoInput.value.trim() : "";

            if (!docente) {
                mostrarEstado("⚠️ Por favor, introduce el nombre del docente.", false);
                docenteInput.focus();
                return;
            }

            if (!equipo) {
                mostrarEstado("⚠️ Por favor, introduce o escanea el código del equipo.", false);
                equipoInput.focus();
                return;
            }

            // Deshabilitar botón durante el proceso
            btnGuardar.disabled = true;
            btnGuardar.classList.add("opacity-60", "cursor-not-allowed");

            const payload = {
                equipo: equipo,
                docente: docente,
                accion: "Préstamo"
            };

            // Envío en modo no-cors a Apps Script
            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain"
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                mostrarEstado("✅ ¡Préstamo registrado correctamente en Google Sheets!", true);
                if (docenteInput) docenteInput.value = "";
